# Ajustech — Nginx + HTTPS (Certbot / Cloudflare)
# Sustituye TU_DOMINIO.com y activa SSL con certbot (ver setup-https.sh).
# Requiere deploy/nginx-ajustech-limits.conf en /etc/nginx/conf.d/

upstream ajustech_node {
    server 127.0.0.1:8799;
    keepalive 32;
}

# Redirección HTTP → HTTPS (Certbot puede gestionar esto también)
server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO.com www.TU_DOMINIO.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name TU_DOMINIO.com www.TU_DOMINIO.com;

    # Rutas rellenadas por: certbot --nginx
    # ssl_certificate /etc/letsencrypt/live/TU_DOMINIO.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Si usas Origin Certificate de Cloudflare en lugar de Let's Encrypt:
    # ssl_certificate     /etc/ssl/cloudflare/TU_DOMINIO.com.pem;
    # ssl_certificate_key /etc/ssl/cloudflare/TU_DOMINIO.com.key;

    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    large_client_header_buffers 4 8k;
    server_tokens off;

    limit_conn ajustech_conn 30;
    limit_req zone=ajustech_req burst=40 nodelay;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # API: sin cache + rate más estricto
    location /api/ {
        limit_req zone=ajustech_api burst=10 nodelay;
        limit_conn ajustech_conn 10;

        proxy_pass http://ajustech_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # API + SPA los sirve Node en 8799 (npm run build && NODE_ENV=production)
    location / {
        proxy_pass http://ajustech_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
    }

    # Nunca servir archivos de entorno / secretos por accidente
    location ~* /\.(env|git|npmrc) {
        deny all;
        return 404;
    }
}
