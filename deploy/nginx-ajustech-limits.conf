# Incluir en http {} — p.ej.:
#   sudo cp deploy/nginx-ajustech-limits.conf /etc/nginx/conf.d/ajustech-limits.conf
limit_req_zone $binary_remote_addr zone=ajustech_req:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ajustech_api:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=ajustech_conn:10m;
